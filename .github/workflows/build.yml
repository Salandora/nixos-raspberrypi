name: Build

on:
  push:
  workflow_dispatch:

env:
  ALL_PACKAGES: |
    linux_rpi3
    linux_rpi5
    raspberrypifw
    raspberrypiWirelessFirmware
  ALL_INSTALLERS: |
    rpi3-installer
    rpi5-installer

jobs:
  build_kernels:
    strategy:
      fail-fast: false
      matrix:
        packages: 
          - linux_rpi3
          - linux_rpi5
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build Kernel Package
        run: nix --accept-flake-config build .#packages.aarch64-linux.${{ matrix.packages }}

  build_packages:
    strategy:
      fail-fast: false
      matrix:
        packages:
          - raspberrypifw
          - raspberrypiWirelessFirmware
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build Packages
        run: nix --accept-flake-config build .#packages.aarch64-linux.${{ matrix.packages }}

  build_installers:
    needs: 
      - build_kernels
      - build_packages
    strategy:
      fail-fast: false
      matrix:
        packages:
          - rpi3-installer
          - rpi5-installer
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build Installers
        run: nix --accept-flake-config build .#nixosConfigurations.${{ matrix.packages }}.config.system.build.toplevel


  upload_artifacts:
    needs: 
      - build_kernels
      - build_packages
      - build_installers
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Create binary cache
        run: |
          mapfile -t packages < <(echo "$ALL_PACKAGES" | grep -v '^[[:space:]]*$')
          mapfile -t installers < <(echo "$ALL_INSTALLERS" | grep -v '^[[:space:]]*$')

          mkdir -p result-store
          for pkg in "${packages[@]}"; do
            echo "Copy ${pkg} to binary cache"
            nix --accept-flake-config copy --no-check-sigs --to file://${PWD}/result-store .#packages.aarch64-linux.${pkg}
          done

          for pkg in "${installers[@]}"; do
            echo "Copy ${pkg} to binary cache"
            nix --accept-flake-config copy --no-check-sigs --to file://${PWD}/result-store .#nixosConfigurations.${pkg}.config.system.build.toplevel
          done

      - uses: actions/upload-artifact@v4
        with:
          name: binary-cache
          path: result-store
          retention-days: 7